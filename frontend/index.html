<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIMEX Fest Chatbot</title>

  <style>
    body {
      font-family: Arial, sans-serif;
    }

    #chatToggle {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #6a00ff;
      color: white;
      border: none;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      font-size: 25px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      z-index: 1000;
    }

    #chatBox {
      position: fixed;
      bottom: 90px;
      right: 20px;
      width: 320px;
      height: 420px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
      display: none;
      flex-direction: column;
      overflow: hidden;
      z-index: 999;
    }

    #chatHeader {
      background: #6a00ff;
      color: white;
      padding: 12px;
      text-align: center;
      font-weight: bold;
      font-size: 16px;
    }

    #messages {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
      font-size: 14px;
      background: #f7f7f7;
    }

    .userMsg {
      text-align: right;
      margin: 8px 0;
    }

    .userMsg span {
      display: inline-block;
      background: #6a00ff;
      color: white;
      padding: 8px 12px;
      border-radius: 15px 15px 0px 15px;
      max-width: 80%;
    }

    .botMsg {
      text-align: left;
      margin: 8px 0;
    }

    .botMsg span {
      display: inline-block;
      background: #e0e0e0;
      color: black;
      padding: 8px 12px;
      border-radius: 15px 15px 15px 0px;
      max-width: 80%;
    }

    #inputArea {
      display: flex;
      border-top: 1px solid #ddd;
      background: white;
    }

    #userInput {
      flex: 1;
      padding: 10px;
      border: none;
      outline: none;
      font-size: 14px;
    }

    #sendBtn {
      background: #6a00ff;
      color: white;
      border: none;
      padding: 10px 15px;
      cursor: pointer;
    }

    #sendBtn:hover {
      background: #5200cc;
    }
  </style>
</head>

<body>
  <button id="chatToggle">🤖</button>

  <div id="chatBox">
    <div id="chatHeader">AIMEX Fest Assistant 🤖</div>

    <div id="messages">
      <div class="botMsg">
        <span>Hello Amar! Ask me about AIMEX Fest 🎉</span>
      </div>
    </div>

    <div id="inputArea">
      <input id="userInput" type="text" placeholder="Type a message..." />
      <button id="sendBtn">➤</button>
    </div>
  </div>

  <script>
    const chatToggle = document.getElementById("chatToggle");
    const chatBox = document.getElementById("chatBox");

    chatToggle.onclick = () => {
      chatBox.style.display =
        chatBox.style.display === "flex" ? "none" : "flex";
    };

    const sendBtn = document.getElementById("sendBtn");
    const userInput = document.getElementById("userInput");
    const messages = document.getElementById("messages");

    const fallbackReplies = [
      {
        pattern: /hello|hi|hey|hii/i,
        reply: "Hello! Welcome to AIMEX Fest 2026. We are excited to have you here."
      },
      {
        pattern: /event|events|schedule/i,
        reply: "AIMEX has multiple exciting events including technical, non-technical, gaming, innovation, and cultural activities."
      },
      {
        pattern: /tech|technical/i,
        reply: "The technical events include coding challenges, innovation showcases, AI sessions, and project competitions."
      },
      {
        pattern: /non[- ]technical|cultural|fun/i,
        reply: "The non-technical and cultural activities include dance, gaming, creative contests, and student engagement events."
      },
      {
        pattern: /location|where|venue/i,
        reply: "AIMEX is hosted at MITS and is designed to bring together students, faculty, and industry experts."
      },
      {
        pattern: /about|aimex/i,
        reply: "AIMEX is a vibrant technical and cultural festival that showcases innovation, creativity, and student talent."
      }
    ];

    function getFallbackReply(message) {
      for (const item of fallbackReplies) {
        if (item.pattern.test(message)) {
          return item.reply;
        }
      }
      return "Thanks for your message! Visit the AIMEX website for the latest event details and updates.";
    }

    async function sendMessage() {
      let msg = userInput.value.trim();
      if (!msg) return;

      messages.innerHTML += `
        <div class="userMsg"><span>${msg}</span></div>
      `;

      userInput.value = "";

      messages.innerHTML += `
        <div class="botMsg"><span>Typing...</span></div>
      `;
      messages.scrollTop = messages.scrollHeight;

      await new Promise(resolve => setTimeout(resolve, 400));

      const lastBotMessage = messages.lastElementChild;
      if (lastBotMessage && lastBotMessage.classList.contains("botMsg")) {
        lastBotMessage.remove();
      }

      const botReply = getFallbackReply(msg);
      messages.innerHTML += `
        <div class="botMsg"><span>${botReply}</span></div>
      `;

      messages.scrollTop = messages.scrollHeight;
    }

    sendBtn.onclick = sendMessage;

    userInput.addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });
  </script>
</body>
</html>
